name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景或痛点，而不是直接描述方案
      placeholder: 当我在……时，我需要……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      placeholder: 你希望 MailAI 怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
      placeholder: 其他工具/变通办法是什么？为什么不满足？
  - type: checkboxes
    id: scope
    attributes:
      label: 涉及范围
      options:
        - label: 邮件安全检测（规则/LLM 复核）
        - label: 小邮助手 / 智能分析
        - label: 邮件收发与文件夹管理
        - label: 界面与交互
        - label: 安装、更新与部署
        - label: 其他

name: Android build
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/android/**', 'VERSION', '.github/workflows/android-preview.yml']
  push:
    paths: ['mobile/android/**', 'VERSION', '.github/workflows/android-preview.yml']
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Compile, test and lint
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: MailAI-Android-development
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

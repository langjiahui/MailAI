name: Diagnose WebKit preview scrolling
on:
  workflow_dispatch:
    inputs:
      version:
        description: Diagnostic reference version (no publication)
        required: true
        default: 4.7.5
permissions:
  contents: read
jobs:
  linux-scroll-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      CI_BROWSER_IMAGE_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/browser-environment
      - name: Probe isolated synthetic previews
        shell: bash
        run: |
          python tests/workspace_preview.py > /tmp/mailai-debug-fixture.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(300):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18795/api/health',timeout=1):
                      break
              except OSError:
                  time.sleep(.1)
          else:
              raise RuntimeError('Isolated fixture startup timed out')
          PY
          MAILAI_BROWSER=webkit node tests/test_mail_output_browser.cjs
          MAILAI_BROWSER=chromium node tests/test_mail_output_browser.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: synthetic-preview-diagnostics
          path: build/mail-output/
          retention-days: 3

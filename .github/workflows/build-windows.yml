name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.2.0
        required: true
        default: 1.0.12

jobs:
  windows-x64:
    runs-on: windows-2022
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build and verify executable
        shell: pwsh
        run: |
          "${{ inputs.version }}" | Set-Content VERSION -NoNewline
          $env:MAILAI_RELEASE_VERSION = "${{ inputs.version }}"
          cmd /c scripts\build_windows.bat
      - uses: actions/upload-artifact@v5
        with:
          name: MailAI-Windows-x64
          path: |
            dist/windows/MailAI/MailAI.exe
            dist/windows/MailAI/MailAI.exe.sha256
            dist/MailAI-Windows-x64-portable.zip
            dist/MailAI-Windows-x64-Setup.exe
            dist/MailAI-Windows-x64-Setup.exe.sha256
          if-no-files-found: error

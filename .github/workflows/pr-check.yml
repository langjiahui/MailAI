name: PR quality gate
on:
  pull_request: null
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
      source_run: ${{ steps.plan.outputs.source_run }}
      mode: ${{ steps.plan.outputs.mode }}
      checks: ${{ steps.plan.outputs.checks }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      browser_image: ${{ steps.plan.outputs.browser_image }}
      browser_version: ${{ steps.plan.outputs.browser_version }}
      browser_parallel: ${{ steps.plan.outputs.browser_parallel }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select impact checks or verified release evidence
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BROWSER_PARALLEL: ${{ vars.CI_BROWSER_PARALLEL || '12' }}
        run: python3 scripts/ci_quality.py plan
      - uses: actions/upload-artifact@v5
        with:
          name: validation-plan
          path: build/ci/plan.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  native-notifications-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install notification test dependencies
        run: python -m pip install -r requirements-test.txt "winrt-runtime>=3.2,<4" "winrt-Windows.Data.Xml.Dom>=3.2,<4"
          "winrt-Windows.Foundation>=3.2,<4" "winrt-Windows.Foundation.Collections>=3.2,<4" "winrt-Windows.UI.Notifications>=3.2,<4"
      - name: Verify native projection and account-bound notification callbacks
        env:
          PYTHONUTF8: '1'
          PYTHONFAULTHANDLER: '1'
        run: python -u -m unittest discover -s tests -p test_mail_notifications.py -v
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.checks)['native-notifications-windows'] }}
  native-scrollbar-macos:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install native WebKit test dependencies
        run: python -m pip install -r requirements-test.txt pyobjc-core==12.2.2 pyobjc-framework-Cocoa==12.2.2 pyobjc-framework-WebKit==12.2.2
          pyobjc-framework-UserNotifications==12.2.2
      - name: Verify native menus and modern notifications
        run: |
          python tests/test_macos_menu.py
          python tests/test_macos_notifications.py
      - name: Verify native scrollbar removal and stable content geometry
        run: |
          python tests/test_settings_scrollbar_webkit.py
          python tests/test_reader_scrollbar_webkit.py
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.checks)['native-scrollbar-macos'] }}
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install frontend check dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run offline release gate
        run: python scripts/check_release.py
    needs: plan
    timeout-minutes: 20
    if: ${{ fromJSON(needs.plan.outputs.checks)['release-gate'] }}
  mail-import-windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify localization coverage on Windows checkout
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node tests/test_i18n_coverage.cjs
      - name: Install import test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify portable mail imports and release metadata
        run: |
          python tests/test_mail_import.py
          python tests/test_mail_recovery.py
          python tests/test_mail_navigation.py
          python tests/test_ios_release.py
    needs: plan
    timeout-minutes: 20
    if: ${{ fromJSON(needs.plan.outputs.checks)['mail-import-windows'] }}
  browser-test:
    name: browser-test (${{ matrix.suite }}, ${{ matrix.browser }}, ${{ matrix.shard }})
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.checks)['browser-test'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.plan.outputs.browser_image }}
      options: --ipc=host
    env:
      CI_BROWSER_IMAGE_VERSION: ${{ needs.plan.outputs.browser_version }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.browser_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/browser-environment
      - name: Run isolated browser group
        env:
          MAILAI_FIXTURE_PYTHON: python
          TEST_SUITE: ${{ matrix.suite }}
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_SHARD: ${{ matrix.shard }}
        run: python scripts/ci_browser.py "$TEST_SUITE" --browser "$TEST_BROWSER" --shard "$TEST_SHARD"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-${{ strategy.job-index }}-evidence
          overwrite: true
          path: |-
            build/ci/
            output/
            build/*preview/
            build/*.png
          if-no-files-found: ignore
          retention-days: 7
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
    needs: plan
    timeout-minutes: 20
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - plan
      - native-notifications-windows
      - native-scrollbar-macos
      - release-gate
      - browser-test
      - mail-import-windows
      - secret-scan
    steps:
      - uses: actions/checkout@v5
      - name: Validate every selected job and distinguish release evidence
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_NEEDS: ${{ toJSON(needs) }}
          QUALITY_SOURCE_RUN: ${{ needs.plan.outputs.source_run }}
          QUALITY_MODE: ${{ needs.plan.outputs.mode }}
          QUALITY_CHECKS: ${{ needs.plan.outputs.checks }}
        run: python3 scripts/ci_quality.py record
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.record.outputs.artifact }}-${{ steps.record.outputs.tree }}
          path: build/quality-evidence/quality.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

name: PR quality gate
on:
  pull_request: null
  push:
    branches:
      - main
permissions:
  contents: read
  actions: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
      source_run: ${{ steps.plan.outputs.source_run }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      growth_matrix: ${{ steps.plan.outputs.growth_matrix }}
      responsive_matrix: ${{ steps.plan.outputs.responsive_matrix }}
      xiaoyou_matrix: ${{ steps.plan.outputs.xiaoyou_matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Find successful verification for the identical source tree
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_quality.py plan
  native-notifications-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install notification test dependencies
        run: python -m pip install -r requirements-test.txt "winrt-runtime>=3.2,<4" "winrt-Windows.Data.Xml.Dom>=3.2,<4"
          "winrt-Windows.Foundation>=3.2,<4" "winrt-Windows.Foundation.Collections>=3.2,<4" "winrt-Windows.UI.Notifications>=3.2,<4"
      - name: Verify native projection and account-bound notification callbacks
        env:
          PYTHONUTF8: '1'
          PYTHONFAULTHANDLER: '1'
        run: python -u -m unittest discover -s tests -p test_mail_notifications.py -v
    needs: plan
    if: ${{ needs.plan.outputs.reuse != 'true' }}
  native-scrollbar-macos:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install native WebKit test dependencies
        run: python -m pip install -r requirements-test.txt pyobjc-core==12.2.2 pyobjc-framework-Cocoa==12.2.2 pyobjc-framework-WebKit==12.2.2
          pyobjc-framework-UserNotifications==12.2.2
      - name: Verify native menus and modern notifications
        run: |
          python tests/test_macos_menu.py
          python tests/test_macos_notifications.py
      - name: Verify native scrollbar removal and stable content geometry
        run: |
          python tests/test_settings_scrollbar_webkit.py
          python tests/test_reader_scrollbar_webkit.py
    needs: plan
    if: ${{ needs.plan.outputs.reuse != 'true' }}
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install frontend check dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run offline release gate
        run: python scripts/check_release.py
    needs: plan
    timeout-minutes: 20
    if: ${{ needs.plan.outputs.reuse != 'true' }}
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/browser-environment
      - name: Run isolated browser group
        env:
          MAILAI_FIXTURE_PYTHON: python
          TEST_SUITE: ${{ matrix.suite }}
        run: python scripts/ci_browser.py "$TEST_SUITE"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-test-${{ strategy.job-index }}-evidence
          path: |-
            build/ci/
            output/
            build/*preview/
            build/*.png
          if-no-files-found: ignore
          retention-days: 7
    needs: plan
    timeout-minutes: 20
    if: ${{ needs.plan.outputs.reuse != 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.browser_matrix) }}
  interaction-continuity-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        browser:
          - chromium
          - webkit
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/browser-environment
        with:
          browsers: ${{ matrix.browser }}
      - name: Run isolated browser group
        env:
          MAILAI_FIXTURE_PYTHON: python
          TEST_BROWSER: ${{ matrix.browser }}
        run: python scripts/ci_browser.py interaction --browser "$TEST_BROWSER"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: interaction-continuity-browser-${{ strategy.job-index }}-evidence
          path: |-
            build/ci/
            output/
            build/*preview/
            build/*.png
          if-no-files-found: ignore
          retention-days: 7
    needs: plan
    timeout-minutes: 20
    if: ${{ needs.plan.outputs.reuse != 'true' }}
  mail-import-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify localization coverage on Windows checkout
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node tests/test_i18n_coverage.cjs
      - name: Install import test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify exported mail imports with LF and CRLF
        run: |
          python tests/test_mail_import.py
          python tests/test_mail_navigation.py
    needs: plan
    timeout-minutes: 20
    if: ${{ needs.plan.outputs.reuse != 'true' }}
  growth-theme-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/browser-environment
      - name: Run isolated browser group
        env:
          MAILAI_FIXTURE_PYTHON: python
          TEST_SUITE: ${{ matrix.suite }}
        run: python scripts/ci_browser.py "$TEST_SUITE"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: growth-theme-browser-${{ strategy.job-index }}-evidence
          path: |-
            build/ci/
            output/
            build/*preview/
            build/*.png
          if-no-files-found: ignore
          retention-days: 7
    needs: plan
    timeout-minutes: 20
    if: ${{ needs.plan.outputs.reuse != 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.growth_matrix) }}
  responsive-ui-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.responsive_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/browser-environment
        with:
          browsers: ${{ matrix.browser }}
      - name: Run isolated browser group
        env:
          MAILAI_FIXTURE_PYTHON: python
          TEST_SUITE: ${{ matrix.suite }}
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_SHARD: ${{ matrix.shard }}
        run: python scripts/ci_browser.py "$TEST_SUITE" --browser "$TEST_BROWSER" --shard "$TEST_SHARD"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: responsive-ui-browser-${{ strategy.job-index }}-evidence
          path: |-
            build/ci/
            output/
            build/*preview/
            build/*.png
          if-no-files-found: ignore
          retention-days: 7
    needs: plan
    timeout-minutes: 20
    if: ${{ needs.plan.outputs.reuse != 'true' }}
  assistant-workspace-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        browser:
          - chromium
          - webkit
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/browser-environment
        with:
          browsers: ${{ matrix.browser }}
      - name: Run isolated browser group
        env:
          MAILAI_FIXTURE_PYTHON: python
          TEST_BROWSER: ${{ matrix.browser }}
        run: python scripts/ci_browser.py assistant-workspace --browser "$TEST_BROWSER"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: assistant-workspace-browser-${{ strategy.job-index }}-evidence
          path: |-
            build/ci/
            output/
            build/*preview/
            build/*.png
          if-no-files-found: ignore
          retention-days: 7
    needs: plan
    if: ${{ needs.plan.outputs.reuse != 'true' }}
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
    needs: plan
    timeout-minutes: 20
  xiaoyou-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAILAI_FIXTURE_PYTHON: python
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/browser-environment
      - name: Run isolated browser group
        env:
          MAILAI_FIXTURE_PYTHON: python
          TEST_SUITE: ${{ matrix.suite }}
        run: python scripts/ci_browser.py "$TEST_SUITE"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: xiaoyou-browser-${{ strategy.job-index }}-evidence
          path: |-
            build/ci/
            output/
            build/*preview/
            build/*.png
          if-no-files-found: ignore
          retention-days: 7
    needs: plan
    if: ${{ needs.plan.outputs.reuse != 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.xiaoyou_matrix) }}
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - plan
      - native-notifications-windows
      - native-scrollbar-macos
      - release-gate
      - browser-test
      - interaction-continuity-browser
      - mail-import-windows
      - growth-theme-browser
      - responsive-ui-browser
      - assistant-workspace-browser
      - secret-scan
      - xiaoyou-browser
    steps:
      - uses: actions/checkout@v5
      - name: Require every job or validate the reused full verification
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_NEEDS: ${{ toJSON(needs) }}
          QUALITY_SOURCE_RUN: ${{ needs.plan.outputs.source_run }}
        run: python3 scripts/ci_quality.py record
      - uses: actions/upload-artifact@v5
        with:
          name: quality-evidence-v1-${{ steps.record.outputs.tree }}
          path: build/quality-evidence/quality.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

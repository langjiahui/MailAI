name: Publish MailAI release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      candidate_head:
        description: Frozen same-repository candidate commit (no publication)
        required: true
        type: string
      candidate_version:
        description: Prepared desktop VERSION (no v prefix)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tree: ${{ steps.plan.outputs.tree }}
      reuse: ${{ steps.plan.outputs.reuse }}
      source_run: ${{ steps.plan.outputs.source_run }}
      source_attempt: ${{ steps.plan.outputs.source_attempt }}
      source_artifacts: ${{ steps.plan.outputs.source_artifacts }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify version, frozen source and eligible installer artifacts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: python3 scripts/ci_release_build.py plan
  windows-x64:
    needs: metadata
    if: ${{ needs.metadata.outputs.reuse != 'true' }}
    runs-on: windows-2022
    env:
      CI: "1"
      MAILAI_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:MAILAI_RELEASE_VERSION
          $version | Set-Content VERSION -NoNewline
          $env:MAILAI_RELEASE_VERSION = $version
          cmd /c scripts\build_windows.bat
      - name: Import Windows code-signing certificate
        id: windows-cert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            "enabled=false" | Out-File $env:GITHUB_OUTPUT -Append
            return
          }
          [IO.File]::WriteAllBytes("build\windows-certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "enabled=true" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Sign Windows installer
        if: steps.windows-cert.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            /f build\windows-certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            dist\MailAI-Windows-x64-Setup.exe
          if ($LASTEXITCODE) { throw "signtool failed with $LASTEXITCODE" }
          & $signtool.FullName verify /pa dist\MailAI-Windows-x64-Setup.exe
          if ($LASTEXITCODE) { throw "Signature verification failed with $LASTEXITCODE" }
      - name: Write checksum for final Windows installer
        shell: pwsh
        run: python scripts/write_sha256.py dist/MailAI-Windows-x64-Setup.exe
      - uses: actions/upload-artifact@v5
        with:
          name: release-windows-x64
          compression-level: 0
          path: |
            dist/MailAI-Windows-x64-Setup.exe
            dist/MailAI-Windows-x64-Setup.exe.sha256
          if-no-files-found: error

  linux-x64:
    needs: metadata
    if: ${{ needs.metadata.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    env:
      CI: "1"
      MAILAI_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Build Linux AppImage
        shell: bash
        run: |
          export MAILAI_BUILD_VERSION="${GITHUB_RUN_NUMBER}"
          printf '%s' "$MAILAI_RELEASE_VERSION" > VERSION
          bash scripts/build_linux_appimage.sh
      - uses: actions/upload-artifact@v5
        with:
          name: release-linux-x64
          compression-level: 0
          path: |
            dist/MailAI-Linux-x64.AppImage
            dist/MailAI-Linux-x64.AppImage.sha256
          if-no-files-found: error

  macos-arm64:
    needs: metadata
    if: ${{ needs.metadata.outputs.reuse != 'true' }}
    runs-on: macos-14
    env:
      CI: "1"
      MAILAI_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Import macOS signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SELF_SIGN_CERTIFICATE: ${{ secrets.MACOS_SELF_SIGN_CERTIFICATE }}
          MACOS_SELF_SIGN_PASSWORD: ${{ secrets.MACOS_SELF_SIGN_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ vars.MACOS_INSTALLER_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            python3 scripts/import_macos_self_signing.py
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/mailai-cert.p12"
          KEYCHAIN=mailai-signing.keychain-db
          KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-mailai-ci}"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | sed 's/[ "]//g')
          # 身份可通过仓库变量覆盖；缺省时从导入的证书自动识别。
          SIGN_IDENTITY="${MACOS_SIGN_IDENTITY:-}"
          INSTALLER_IDENTITY="${MACOS_INSTALLER_IDENTITY:-}"
          if [ -z "$SIGN_IDENTITY" ]; then
            SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"' || true)
          fi
          if [ -z "$INSTALLER_IDENTITY" ]; then
            INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN" \
              | grep -o '"Developer ID Installer:[^"]*"' | head -1 | tr -d '"' || true)
          fi
          test -n "$SIGN_IDENTITY" || { echo "No codesigning identity found in certificate"; exit 1; }
          {
            echo "MAILAI_SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "MAILAI_INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
          } >> "$GITHUB_ENV"
      - name: Verify real keychain access across signed upgrades
        if: env.MAILAI_SIGNING_MODE == 'self-signed'
        run: python3 scripts/verify_macos_signing_upgrade.py
      - name: Build Apple Silicon installer
        shell: bash
        env:
          MAILAI_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MAILAI_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MAILAI_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          export MAILAI_BUILD_VERSION="${GITHUB_RUN_NUMBER}"
          printf '%s' "$MAILAI_RELEASE_VERSION" > VERSION
          zsh scripts/build_macos.command
      - name: Write macOS checksum
        shell: bash
        run: shasum -a 256 dist/MailAI-macOS-arm64.pkg > dist/MailAI-macOS-arm64.pkg.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: release-macos-arm64
          compression-level: 0
          path: |
            dist/MailAI-macOS-arm64.pkg
            dist/MailAI-macOS-arm64.pkg.sha256
            dist/MailAI-macOS-arm64.dmg
          if-no-files-found: error
      - name: Remove temporary self-signing keychain
        if: always()
        shell: bash
        run: python3 scripts/cleanup_macos_self_signing.py

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan the release commit history for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Require successful verification for the complete release source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_quality.py wait --commit "$GITHUB_SHA"

  publish:
    needs: [metadata, windows-x64, macos-arm64, linux-x64, quality]
    # Private preparation never publishes. Both paths still require full proof;
    # only the native build jobs can be replaced by verified identical artifacts.
    if: >-
      ${{ always() && github.event_name == 'push' && needs.metadata.result == 'success' && needs.quality.result == 'success' &&
      ((needs.metadata.outputs.reuse == 'true' && needs.windows-x64.result == 'skipped' && needs.macos-arm64.result == 'skipped' && needs.linux-x64.result == 'skipped') ||
      (needs.metadata.outputs.reuse == 'false' && needs.windows-x64.result == 'success' && needs.macos-arm64.result == 'success' && needs.linux-x64.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        if: ${{ needs.metadata.outputs.reuse != 'true' }}
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore and verify immutable candidate installers
        if: ${{ needs.metadata.outputs.reuse == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.metadata.outputs.source_run }}
          SOURCE_ATTEMPT: ${{ needs.metadata.outputs.source_attempt }}
          SOURCE_ARTIFACTS: ${{ needs.metadata.outputs.source_artifacts }}
          RELEASE_TREE: ${{ needs.metadata.outputs.tree }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: >-
          python scripts/ci_release_build.py restore --run "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT"
          --artifacts "$SOURCE_ARTIFACTS" --tree "$RELEASE_TREE" --version "$RELEASE_VERSION" --assets release-assets
      - name: Verify final platform checksums
        run: python scripts/ci_release_build.py verify-assets --assets release-assets
      - name: Install release signature dependencies
        run: python -m pip install 'cryptography>=44,<47' certifi
      - name: Create device update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "Missing update signing key" >&2; exit 1; }
          python scripts/create_release_manifest.py \
            --version "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --assets release-assets \
            --output release-assets/latest.json \
            --readme README.md \
            --notes-output release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "MailAI ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --latest

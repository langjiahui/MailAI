name: Publish MailAI release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify release version and README
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(tr -d '\r\n' < VERSION)" = "$version"
          grep -F "当前版本：**v${version}**" README.md
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify startup animation and preference persistence
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium
          node tests/test_preloader_browser.cjs
          node tests/test_ui_preferences_restart.cjs "$(which python)"

  windows-x64:
    needs: metadata
    runs-on: windows-2022
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $version | Set-Content VERSION -NoNewline
          $env:MAILAI_RELEASE_VERSION = $version
          cmd /c scripts\build_windows.bat
      - name: Import Windows code-signing certificate
        id: windows-cert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            "enabled=false" | Out-File $env:GITHUB_OUTPUT -Append
            return
          }
          [IO.File]::WriteAllBytes("build\windows-certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "enabled=true" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Sign Windows installer
        if: steps.windows-cert.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            /f build\windows-certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            dist\MailAI-Windows-x64-Setup.exe
          if ($LASTEXITCODE) { throw "signtool failed with $LASTEXITCODE" }
          & $signtool.FullName verify /pa dist\MailAI-Windows-x64-Setup.exe
          if ($LASTEXITCODE) { throw "Signature verification failed with $LASTEXITCODE" }
      - name: Write checksum for final Windows installer
        shell: pwsh
        run: python scripts/write_sha256.py dist/MailAI-Windows-x64-Setup.exe
      - uses: actions/upload-artifact@v5
        with:
          name: release-windows-x64
          path: |
            dist/MailAI-Windows-x64-Setup.exe
            dist/MailAI-Windows-x64-Setup.exe.sha256
          if-no-files-found: error

  linux-x64:
    needs: metadata
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build Linux AppImage
        shell: bash
        run: |
          export MAILAI_RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          export MAILAI_BUILD_VERSION="${GITHUB_RUN_NUMBER}"
          printf '%s' "$MAILAI_RELEASE_VERSION" > VERSION
          bash scripts/build_linux_appimage.sh
      - uses: actions/upload-artifact@v5
        with:
          name: release-linux-x64
          path: |
            dist/MailAI-Linux-x64.AppImage
            dist/MailAI-Linux-x64.AppImage.sha256
          if-no-files-found: error

  macos-arm64:
    needs: metadata
    runs-on: macos-14
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Import macOS signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ vars.MACOS_INSTALLER_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No signing certificate configured; building unsigned artifacts."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/mailai-cert.p12"
          KEYCHAIN=mailai-signing.keychain-db
          KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-mailai-ci}"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | sed 's/[ "]//g')
          # 身份可通过仓库变量覆盖；缺省时从导入的证书自动识别。
          SIGN_IDENTITY="${MACOS_SIGN_IDENTITY:-}"
          INSTALLER_IDENTITY="${MACOS_INSTALLER_IDENTITY:-}"
          if [ -z "$SIGN_IDENTITY" ]; then
            SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"' || true)
          fi
          if [ -z "$INSTALLER_IDENTITY" ]; then
            INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN" \
              | grep -o '"Developer ID Installer:[^"]*"' | head -1 | tr -d '"' || true)
          fi
          test -n "$SIGN_IDENTITY" || { echo "No codesigning identity found in certificate"; exit 1; }
          {
            echo "MAILAI_SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "MAILAI_INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
          } >> "$GITHUB_ENV"
      - name: Build Apple Silicon installer
        shell: bash
        env:
          MAILAI_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MAILAI_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MAILAI_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          export MAILAI_RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          export MAILAI_BUILD_VERSION="${GITHUB_RUN_NUMBER}"
          printf '%s' "$MAILAI_RELEASE_VERSION" > VERSION
          zsh scripts/build_macos.command
      - name: Write macOS checksum
        shell: bash
        run: shasum -a 256 dist/MailAI-macOS-arm64.pkg > dist/MailAI-macOS-arm64.pkg.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: release-macos-arm64
          path: |
            dist/MailAI-macOS-arm64.pkg
            dist/MailAI-macOS-arm64.pkg.sha256
            dist/MailAI-macOS-arm64.dmg
          if-no-files-found: error

  publish:
    needs: [windows-x64, macos-arm64, linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create device update manifest
        run: |
          python scripts/create_release_manifest.py \
            --version "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --assets release-assets \
            --output release-assets/latest.json \
            --readme README.md \
            --notes-output release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "MailAI ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --latest

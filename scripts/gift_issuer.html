<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小邮礼物发放</title>
  <style>__STYLES__</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v4H4zM6 12h12v8H6zM12 8v12M12 8C7 8 5 3 8 3c3 0 4 5 4 5Zm0 0c5 0 7-5 4-5-3 0-4 5-4 5Z"/></svg>
    <div class="heading"><h1 data-copy="title">小邮礼物发放</h1><p data-copy="intro">选好礼物，生成领取券，再把礼物送出去。</p></div>
    <select id="language" aria-label="Language"><option value="zh-CN">中文</option><option value="en">English</option></select>
  </header>
  <div class="issuer-grid">
    <section class="card" id="form-card">
      <div class="steps" data-label="steps"><span class="current" data-copy="step1"></span><span data-copy="step2"></span><span data-copy="step3"></span></div>
      <form class="fields" id="issuer-form">
        <label><span data-copy="name"></span><input id="title" maxlength="80" value="小邮见面礼" required autocomplete="off"></label>
        <div class="row">
          <label><span data-copy="who"></span><select id="kind"><option value="exclusive" data-copy="personal"></option><option value="campaign" data-copy="campaign"></option></select></label>
          <label><span data-copy="deadline"></span><select id="days"><option value="0" data-copy="unlimited"></option><option value="7" data-copy="days7"></option><option value="30" data-copy="days30"></option><option value="90" data-copy="days90"></option></select></label>
        </div>
        <label id="recipient-label"><span data-copy="recipient"></span><small data-copy="recipientHint"></small><input id="recipient" data-placeholder="recipientPlaceholder" maxlength="60" required spellcheck="false" autocomplete="off" aria-describedby="recipient-error"><small id="recipient-error" class="error" role="alert"></small></label>
        <section>
          <div class="items-head"><b data-copy="pick"></b><span id="count" role="status"></span></div>
          <div class="items">__OPTIONS__</div><p class="hint" data-copy="itemsHint"></p>
        </section>
        <div class="retry" id="retry" hidden role="status"><span data-copy="retryHint"></span><button type="button" id="restart" data-copy="restart"></button></div>
        <button id="issue" class="primary" type="submit" disabled></button><p id="error" role="alert"></p>
      </form>
    </section>
    <aside class="side">
      <section class="card" id="review"><h2 data-copy="review"></h2><div id="selection"></div><p id="meta"></p></section>
      <section class="card" id="result" hidden aria-labelledby="result-title">
        <div class="success"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8"/></svg><span id="result-title" data-copy="ready"></span></div>
        <p id="summary"></p><p id="result-meta"></p>
        <div class="actions"><button id="copy" class="primary" type="button" data-copy="copy"></button><a class="download" id="download" data-copy="export"></a></div>
        <div id="copy-status" role="status"></div>
        <details class="code-details"><summary data-copy="viewCode"></summary><textarea id="code" readonly data-label="voucher"></textarea></details>
        <p class="hint" data-copy="sendHint"></p>
      </section>
      <details class="card history" id="history">
        <summary data-copy="history"></summary><div class="history-head"><small data-copy="historyHint"></small><button id="refresh-history" type="button" data-copy="refresh"></button></div>
        <p id="history-status" role="status"></p><div id="history-list"></div>
      </details>
    </aside>
  </div>
</main>
<script>__SCRIPT__</script>
</body>
</html>
